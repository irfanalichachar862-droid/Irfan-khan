    <meta charset="UTF-8" />

    <title>ScanWake - Anti-Cheat Alarm & QR Wake Lockout</title>
    <meta name="description" content="Anti-cheat wake-up alarm application for Android enforcing morning wakefulness through physical QR/barcode scanning, sequential alarm chains, and lockout guards." />
    <meta property="og:title" content="ScanWake - Anti-Cheat Alarm & QR Wake Lockout" />
    <meta property="og:description" content="Anti-cheat wake-up alarm application for Android enforcing morning wakefulness through physical QR/barcode scanning, sequential alarm chains, and lockout guards." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already defined or restricted
        }

        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
